# Конфигурация для Render (Docker web service).
# ВАЖНО: для уже созданного вручную сервиса источник правды — вкладка
# Environment в дашборде Render. Здесь файл для документации.
services:
  - type: web
    name: telegram-miniapp
    runtime: docker
    plan: free
    # Liveness: /healthz (быстрый, без БД) — чтобы холодный старт Neon не вызывал
    # рестарт-флаппинг единственного инстанса на free-плане.
    # Readiness c пингом БД доступен на /readyz (для мониторинга и мульти-инстанса).
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false        # токен от @BotFather
      - key: WEBAPP_URL
        sync: false        # https://<твой-сервис>.onrender.com
      - key: BOT_RUN_MODE
        value: webhook     # на Render команды /start приходят через webhook
      - key: ADMIN_USER_IDS
        sync: false        # Telegram user_id админов через запятую для /diag и /openai_test
      - key: OPENAI_API_KEY
        sync: false        # ключ OpenAI API из platform.openai.com
      - key: OPENAI_MODEL
        value: gpt-4o-mini # дёшево + быстро (без reasoning-паузы) + грамотно для коротких реплик
      - key: AI_DAILY_MESSAGE_LIMIT
        value: "0"         # 0 = без дневного лимита сообщений (per-user)
      - key: OPENAI_DAILY_COST_LIMIT_USD
        value: "0"         # ВАЖНО: задайте под свой бюджет (напр. 10) — глобальный
                           # суточный потолок расходов OpenAI; 0 = выключено (без защиты)
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "120"       # базовая защита API от спама
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "30"        # защита OpenAI/голосовых endpoint'ов от спама и расходов
      - key: REMINDER_CRON_SECRET
        sync: false        # секрет для POST /internal/send-reminders; ТО ЖЕ значение
                           # задать в GitHub Secrets. Пусто = рассылка выключена
      - key: REMINDER_ACTIVITY_WINDOW_DAYS
        value: "14"        # напоминаем только активным за последние N дней
      - key: OPENAI_INPUT_COST_PER_1M
        value: "0.75"      # USD за 1M input tokens для выбранной модели
      - key: OPENAI_OUTPUT_COST_PER_1M
        value: "4.50"      # USD за 1M output tokens для выбранной модели
      - key: DAILY_LESSON_REWARD_POINTS
        value: "25"
      - key: DATABASE_URL
        sync: false        # строка подключения Neon (postgresql://...?sslmode=require)
